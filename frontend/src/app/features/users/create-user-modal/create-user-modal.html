<div class="modal-backdrop">
  <div class="modal-card">
    <h2>Add New User</h2>

    <form>
      <div>
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" [(ngModel)]="fullName" name="fullName" />
      </div>

      <div>
        <label for="startingBalance">Starting Balance</label>
        <input
          id="startingBalance"
          type="number"
          step="0.01"
          [(ngModel)]="startingBalance"
          name="startingBalance"
        />
      </div>

      <div>
        <label for="monthlySalary">Monthly Salary</label>
        <input
          id="monthlySalary"
          type="number"
          step="0.01"
          [(ngModel)]="monthlySalary"
          name="monthlySalary"
        />
      </div>

      <div>
        <label for="salaryDay">Salary Day</label>
        <input
          id="salaryDay"
          type="number"
          min="1"
          max="31"
          [(ngModel)]="salaryDay"
          name="salaryDay"
        />
      </div>
    </form>

    <div class="actions">
      <button type="button" (click)="closed.emit()">Cancel</button>
      <button
        type="button"
        (click)="submitted.emit({
            fullName: fullName,
            startingBalance: startingBalance,
            monthlySalary: monthlySalary,
            salaryDay: salaryDay,
        })">
        Finish
      </button>
    </div>
  </div>
</div>
